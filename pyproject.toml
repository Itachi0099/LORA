[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-transition-analyzer"
version = "0.0.1"
description = "Post-set transition analysis for DJ mixes"
requires-python = "==3.9.*"
dependencies = [
    "numpy==1.23.5",
    "scipy==1.13.1",
    "librosa==0.11.0",
    "ruptures==1.1.10",
    "madmom==0.16.1",
    "setuptools<81",
    "cython==3.2.9",
    "jsonschema==4.25.1",
]

[project.scripts]
djx = "analyzer.cli:main"

[project.optional-dependencies]
notebook = [
    "jupyter==1.1.1",
    "ipykernel==6.31.0",
    "matplotlib==3.9.4",
]
fallback = [
    "basic-pitch==0.4.0",
]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools]
packages = ["analyzer", "analyzer.features", "analyzer.detect", "analyzer.score"]

[tool.uv]
# madmom's setup.py imports numpy at build time (Known Risk 5 — see notebooks/ENVIRONMENT.md).
no-build-isolation-package = ["madmom"]
